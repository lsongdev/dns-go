# Forwarding resolver: local zones and overrides, ad filtering, caching, and
# encrypted upstreams. Fits a router or NAS on a LAN as well as a cloud host
# serving your devices over DoH/DoT. See config.authoritative.yaml for
# running as an authoritative name server.
mode: forwarding

listens:
  - type: udp
    addr: ":15353"
  - type: tcp
    addr: ":15353"
  # DoH. With cert_file/key_file it serves HTTPS directly (HTTP/2); without,
  # plain HTTP for a TLS-terminating reverse proxy. Path: /dns-query
  - type: doh
    addr: ":8443"
  # DoT on 853. With hostname set, clients connecting to
  # "<id>.dns.example.com" are identified as client <id> (wildcard cert).
  # - type: dot
  #   addr: ":853"
  #   hostname: dns.example.com
  #   cert_file: /etc/letsencrypt/live/dns.example.com/fullchain.pem
  #   key_file: /etc/letsencrypt/live/dns.example.com/privkey.pem
  # Behind nginx/Caddy, trust its X-Forwarded-For:
  # - type: doh
  #   addr: "127.0.0.1:8053"
  #   trusted_proxies: [127.0.0.1]

upstreams: # tried in order; SERVFAIL/REFUSED/errors fail over to the next
  - type: doh
    addr: "https://doh.pub/dns-query"
    timeout: 5s
  - type: dot
    addr: "1.1.1.1:853"
    timeout: 3s
  - type: udp
    addr: "8.8.8.8:53"
    timeout: 3s

cache:
  enabled: true
  max_ttl: 24h
  negative_ttl: 5m
  max_entries: 10000

domains:
  # static: the zone owns the namespace; unknown names are NXDOMAIN.
  - domain: home.lan
    records:
      - "@ 3600 IN A 192.168.1.1"
      - "nas 3600 IN A 192.168.1.100"
      - "printer 3600 IN A 192.168.1.101"
      - "router 3600 IN CNAME home.lan."
  # transparent: override individual public names; everything else under
  # the domain still resolves upstream. CNAMEs to outside names are chased.
  - domain: example.com
    kind: transparent
    records:
      - "dev 300 IN A 192.168.1.50"
  # BIND zone files work too:
  # - domain: example.org
  #   zone_file: ./testdata/zones/example.com.zone
  # hosts files are transparent zones at the root:
  # - hosts_file: /etc/hosts

filters:
  block_mode: zero_ip # zero_ip | nxdomain | refused
  cache_dir: ./data/filters
  lists:
    - name: adguard-dns
      url: "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt"
      refresh: 24h
    - name: easylist-china
      url: "https://easylist-downloads.adblockplus.org/easylistchina.txt"
      enabled: false
  rules:
    - "||doubleclick.net^"
    - "||google-analytics.com^"
    - "@@||example.com^"

# Who may query. Without an allow list a forwarding resolver serves only
# loopback and private networks, so it is never an open resolver by
# accident. Devices outside those networks authenticate with a client ID:
# DoH https://dns.example.com/dns-query/<id>, or DoT <id>.dns.example.com.
access:
  allow: [private]
  # deny: [192.168.1.66]
  deny_action: refuse # refuse | drop (no reply over UDP)
  clients:
    - name: laptop
      ids: [replace-with-a-random-secret]
    - name: living-room-tv
      networks: [192.168.1.50]
